name: STAR consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # First, because it names the likeliest mistake outright: a tree was edited
      # instead of .agents/skills, so it is no longer what the port rules produce.
      - name: Check the six generated skill trees against .agents/skills
        run: bash .github/scripts/port.sh
      - name: Run consistency checks
        run: bash .github/scripts/check_consistency.sh
      - name: Check offline model routing
        run: bash .github/scripts/check_model_routing.sh
      - name: Check offline workflow state and recovery
        run: bash .github/scripts/check_workflow.sh
      - name: Run offline behavior regression tests
        run: node --test .github/scripts/tests/*.test.mjs

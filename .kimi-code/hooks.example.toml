# STAR hooks for Kimi Code — registration snippet.
#
# Two hooks: model_id provenance, and the project-memory index injected from
# .star/memory/.
#
# EASIEST: run `bash .kimi-code/hooks/install.sh` once — it writes both blocks
# below into your global config for you (idempotent, backs up first). The manual
# route below is the same thing by hand.
#
# Kimi does not auto-load project-level config, so these cannot live in the repo
# the way .claude/settings.json, .codex/hooks.json, and .cursor/hooks.json do.
# To enable them manually, copy the [[hooks]] blocks below into your GLOBAL
# Kimi config at $KIMI_CODE_HOME/config.toml (default ~/.kimi-code/config.toml).
# The relative command paths work because Kimi runs hook commands with the
# working directory set to the session's project root, so they resolve to each
# STAR project's own copy — one global entry each then serves every STAR project
# with no per-project editing, and in a non-STAR session the path is simply
# absent and the hook no-ops (fail-open). If your Kimi build does not resolve
# relative hook paths, replace `command` with the ABSOLUTE path to this repo's
# script (which must then be edited per project).
#
# Why UserPromptSubmit rather than SessionStart: in Kimi, SessionStart is
# fire-and-forget and cannot inject context, and its payload carries no model
# id. UserPromptSubmit is the only context-appending event. Both hooks inject
# once per session (keyed on session_id), so they do not repeat every turn.
#
# Note: [[hooks]] accepts only event / matcher / command / timeout — any extra
# field makes the whole config fail to load.

[[hooks]]
event = "UserPromptSubmit"
command = ".kimi-code/hooks/star_model_id.sh"
timeout = 10

[[hooks]]
event = "UserPromptSubmit"
command = ".kimi-code/hooks/star_memory.sh"
timeout = 10
